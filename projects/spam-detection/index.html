<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Detection — UI Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: #333;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .badge-bar{
            color: rgba(255,255,255,0.9);
            font-size: 0.85em;
            max-width: 500px;
            width: 90%;
            margin: 20px auto 0;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 30px;
            margin: 20px auto;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            color: #6a11cb;
        }

        p {
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-control {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
        }

        .btn {
            padding: 15px 30px;
            background-color: #6a11cb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #2575fc;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            display: none;
        }

        .result.spam {
            background-color: #ffdddd;
            color: #d8000c;
            display: block;
        }

        .result.ham {
            background-color: #ddffdd;
            color: #4f8a10;
            display: block;
        }

        .back-link{
            margin-top: 25px;
        }
        .back-link a{
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            font-size: 0.95em;
        }
        .back-link a:hover{ text-decoration: underline; }

        @media (max-width: 600px) {
            h1 { font-size: 1.5em; }
            p { font-size: 1em; }
            .btn { padding: 10px 20px; font-size: 1em; }
            .result { font-size: 1em; }
        }
    </style>
</head>
<body>
    <p class="badge-bar"><i class="fas fa-circle-info"></i>
        This is a static front-end preview. The real app runs on Django with a
        Naive Bayes model trained in scikit-learn — this page uses a small
        keyword check instead, just to demonstrate the interface.
    </p>
    <div class="container">
        <h1><i class="fas fa-shield-alt"></i> Spam Detection</h1>
        <p>Enter your message below to check if it is spam or not.</p>
        <form id="checkForm">
            <textarea class="form-control" id="text" rows="5" placeholder="Enter your message here..." required></textarea>
            <button type="submit" class="btn"><i class="fas fa-check"></i> Check</button>
        </form>
        <div class="result" id="result"></div>
    </div>
    <p class="back-link"><a href="../../index.html#projects">&larr; Back to portfolio</a></p>

    <script>
        // Lightweight client-side stand-in for the real Naive Bayes model,
        // which runs server-side in the Django app. This just flags a few
        // common spam-style words so the UI can be demoed without a backend.
        const spammyWords = ['free', 'win', 'winner', 'click here', 'urgent',
            'act now', 'cash', 'prize', 'congratulations', 'limited time',
            'buy now', 'offer', 'guarantee', '$$$', 'viagra', 'lottery'];

        document.getElementById('checkForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const text = document.getElementById('text').value.toLowerCase();
            const hit = spammyWords.some(w => text.includes(w));
            const box = document.getElementById('result');
            box.className = 'result ' + (hit ? 'spam' : 'ham');
            box.innerHTML = '<h2 style="margin:0;font-size:1em;">The message is: ' + (hit ? 'Spam' : 'Ham') + '</h2>';
        });
    </script>
</body>
</html>
